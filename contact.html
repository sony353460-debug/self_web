<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BoXen 的聯絡頁面。">
    <link rel="stylesheet" href="assets/css/nav.css">
    <link rel="stylesheet" href="assets/css/contact.css">
    <link rel="stylesheet" href="assets/css/theme.css">
    <script src="assets/js/theme.js"></script>
    <script src="assets/js/nav.js" defer></script>
    <title>聯絡我｜BoXen</title>
</head>
<body class="main-body">
    <nav class="custom-navbar" aria-label="主要導覽">
        <div class="nav-container">
            <a href="./index.html" class="nav-name">BoXen</a>
            <div class="nav-menu">
                <a href="./resume.html" class="nav-item">
                    <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" class="nav-icon"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <span>Resume</span>
                </a>
                <a href="./blog.html" class="nav-item">
                    <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" class="nav-icon"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/><path d="M14 10H8"/><path d="M14 14H8"/></svg>
                    <span>Blog</span>
                </a>
                <a href="./project.html" class="nav-item">
                    <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" class="nav-icon"><path d="M18 16l4-4-4-4"/><path d="M6 8l-4 4 4 4"/><path d="M14.5 4l-5 16"/></svg>
                    <span>Project</span>
                </a>
            </div>
            <button class="theme-toggle" type="button" aria-label="切換為淺色模式" aria-pressed="false">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6 7 7m10 10 1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/><circle cx="12" cy="12" r="4"/></svg>
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5 8.5 8.5 0 1 0 20.5 14.5Z"/></svg>
            </button>
        </div>
    </nav>

    <main class="contact-container">
        <div class="contact-title">
            <h1>Contact</h1>
            <p>有任何問題都可到我的社群網站聯繫我，也可直接在這裡留言</p><br><br>
        </div>
        <form>
            <div class="input-group">
                <label>NAME：</label>
                <input type="text" name="name" placeholder="暱稱">
            </div>
            <div class="input-group">
                <label>EMAIL：</label>
                <input type="email" name="email" placeholder="email">
            </div>
            <div class="input-group">
                <label>CONTACT：</label>
                <textarea placeholder="想對我說......"></textarea>
            </div>
            <button type="submit" class="submit-btn">送出訊息</button>
        </form>
    </main>



    <div class="image"><img src="./assets/images/design.png"></div>
    

</body>
</html>
